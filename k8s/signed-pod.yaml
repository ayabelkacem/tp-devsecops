apiVersion: v1
kind: Pod
metadata:
  name: signed-test
  namespace: app
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: ghcr.io/ayabelkacem/tp-devsecops-ci@sha256:e4711d013a598fd89fb4d04841510b6ce9e6986685412f12e8f44c2ce463a8b0
      command: ["sleep", "3600"]
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: 250m
          memory: 128Mi
