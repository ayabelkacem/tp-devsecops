apiVersion: v1
kind: Pod
metadata:
  name: signed-test
  namespace: app
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: ghcr.io/ayabelkacem/tp-devsecops-ci@sha256:9c86ee21d13d692a245d5a6bb3e5e971e774c90e6476dafcbcf9e494575d48d5
      command: ["sleep", "3600"]
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: 250m
          memory: 128Mi
