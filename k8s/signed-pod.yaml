apiVersion: v1
kind: Pod
metadata:
  name: signed-test
  namespace: app
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: ghcr.io/ayabelkacem/tp-devsecops@sha256:d31b1c194f72cf660c8bb3b2a048b1457ec087ff31aeb4ae086f1a98323ed184
      command: ["sleep", "3600"]
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: 250m
          memory: 128Mi
