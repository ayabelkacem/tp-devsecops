apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - app
      verifyImages:
        - imageReferences:
            - "*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                        -----BEGIN PUBLIC KEY-----
                        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEvD26NtlP9xOI92DFkaikXIsP8/3I
                        b5oYfTH3OOlHLkNno1lNDZM8jg3tZqYnVNQUz68+QoEYlX6Lm63dQ1GHLQ==
                        -----END PUBLIC KEY-----
                    rekor:
                      ignoreTlog: true
