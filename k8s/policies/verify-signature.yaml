apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - app
      verifyImages:
        - imageReferences:
            - "*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                        -----BEGIN PUBLIC KEY-----
                        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEnzYadyUwpXUjOSkQU5I+7ZhQngoX
                        NpgcCm2/HO7cJWH5DmqtFAJ3WaDngtAPDT4G7FmMI/qmcy0m98vmdzCDOA==
                        -----END PUBLIC KEY-----
                    rekor:
                      ignoreTlog: true
