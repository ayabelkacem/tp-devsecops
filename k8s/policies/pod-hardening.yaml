apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-hardening
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - app
      validate:
        message: "The :latest tag is forbidden. Use a version or a digest."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
    - name: require-non-root-no-privilege
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - app
      validate:
        message: "Containers must run as non-root, not privileged, with no privilege escalation."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
                  privileged: false
                  allowPrivilegeEscalation: false
