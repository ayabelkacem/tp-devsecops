apiVersion: v1
kind: Pod
metadata:
  name: unsigned-test
  namespace: app
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: ghcr.io/ayabelkacem/tp-devsecops:t3
      command: ["sleep", "3600"]
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: 250m
          memory: 128Mi
