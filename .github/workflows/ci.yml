name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Gitleaks scan (full history)
        run: /tmp/gitleaks detect --source . --redact --exit-code=1 --log-level=debug

  iac-scan:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquasec/trivy:0.65.0 \
            config --severity HIGH,CRITICAL --exit-code 1 k8s/

  build-sign:
    runs-on: ubuntu-latest
    needs: [secret-scan, iac-scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-ci
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          docker build -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }})
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.18.1/install.sh | sh -s -- -b /usr/local/bin v1.18.1
      - name: Generate SBOM (CycloneDX)
        run: syft "$IMAGE_DIGEST" -o cyclonedx-json=sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Sign image by digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$COSIGN_PRIVATE_KEY" || (echo "COSIGN_PRIVATE_KEY secret is missing" >&2; exit 1)
          if [[ "$COSIGN_PRIVATE_KEY" == *"PRIVATE KEY"* ]]; then
            KEY="${COSIGN_PRIVATE_KEY//\\n/$'\n'}"
            printf '%s' "$KEY" > cosign.key
          else
            printf '%s' "$COSIGN_PRIVATE_KEY" | base64 --decode > cosign.key
          fi
          test -s cosign.key
          cosign sign --yes --key cosign.key "$IMAGE_DIGEST"
